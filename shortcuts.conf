$terminal = footclient
$fileManager = thunar
$menu = wofi --show drun
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
# bind = $mainMod SHIFT, Q, exec, $terminal start -- zellij
# bind = $mainMod, Q, exec, $terminal start -- zellij
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, L, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, exec, librewolf -P Private
bind = $mainMod SHIFT, F, exec, librewolf -P Developer
bind = SHIFT ALT, F, exec, librewolf -P Cardiff
bind = CTRL_SHIFT, F, exec, librewolf -P Entertainment

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, hyprspace switch 1
bind = $mainMod, 2, exec, hyprspace switch 2
bind = $mainMod, 3, exec, hyprspace switch 3
bind = $mainMod, 4, exec, hyprspace switch 4
bind = $mainMod, 5, exec, hyprspace switch 5
bind = $mainMod, 6, exec, hyprspace switch 6
bind = $mainMod, 7, exec, hyprspace switch 7
bind = $mainMod, 8, exec, hyprspace switch 8
bind = $mainMod, 9, exec, hyprspace switch 9
bind = $mainMod, 0, exec, hyprspace switch 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, hyprspace move 1
bind = $mainMod SHIFT, 2, exec, hyprspace move 2
bind = $mainMod SHIFT, 3, exec, hyprspace move 3
bind = $mainMod SHIFT, 4, exec, hyprspace move 4
bind = $mainMod SHIFT, 5, exec, hyprspace move 5
bind = $mainMod SHIFT, 6, exec, hyprspace move 6
bind = $mainMod SHIFT, 7, exec, hyprspace move 7
bind = $mainMod SHIFT, 8, exec, hyprspace move 8
bind = $mainMod SHIFT, 9, exec, hyprspace move 9
bind = $mainMod SHIFT, 0, exec, hyprspace move 10

# Set offsets
bind = $mainMod CONTROL, 2, exec, hyprspace offset 1
bind = $mainMod CONTROL, 3, exec, hyprspace offset 2
bind = $mainMod CONTROL, 4, exec, hyprspace offset 3

bind = $mainMod SHIFT, TAB, movewindow, mon:+1
# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, exec, hyprspace switch e+1
bind = $mainMod, mouse_up, exec, hyprspace switch e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, right, resizeactive, 30 0
bind = $mainMod SHIFT, left, resizeactive, -30 0
bind = $mainMod SHIFT, up, resizeactive, 0 -30
bind = $mainMod SHIFT, down, resizeactive, 0 30

# Move window with mainMod + alt + arrow keys
bind = $mainMod ALT, left, movewindow, l
bind = $mainMod ALT, right, movewindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# Change brightness with special keys
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind=SHIFT, XF86MonBrightnessDown, exec, brightnessctl set 1%-
bind=,XF86MonBrightnessUp,exec,brightnessctl set +5% 
bind=SHIFT, XF86MonBrightnessUp, exec, brightnessctl set +1%

# Take screenshot with PrintScreen
# bind = , Print, exec, flameshot gui
bind = , Print, exec, hyprshot -s -m region -f screenshot.png -o /tmp/
bind = $mainMod, Print, exec, hyprshot -s -m window -m active -f screenshot.png -o /tmp/

# Volume control with special keys
bind=,XF86AudioMute,exec,pactl set-sink-mute @DEFAULT_SINK@ toggle
bind=,XF86AudioLowerVolume,exec,pactl set-sink-volume @DEFAULT_SINK@ -5%
bind=SHIFT, XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%
bind=,XF86AudioRaiseVolume,exec,pactl set-sink-volume @DEFAULT_SINK@ +5%
bind=SHIFT, XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +1%

# Media control with special keys
bind=,XF86AudioPlay,exec,playerctl play-pause
bind=,XF86AudioNext,exec,playerctl next
bind=,XF86AudioPrev,exec,playerctl previous

# Clipboard manager
bind= SUPER_SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind= SUPER_SHIFT, P, exec, cliphist wipe

bind = $mainMod, B, exec, killall -SIGUSR1 waybar
# bind = $mainMod, A, exec, nwg-drawer
# bind = $mainMod, L, exec, swaylock -i $(swww query | awk 'NR==1{ print $9 }')
bind = $mainMod, L, exec, swaylock -i ~/.config/assets/loluet_cropped.jpg
bind = ALT SHIFT, L, exec, hyprlock
bind = $mainMod, SPACE, exec, albert show
bind = $mainMod, T, exec, thunderbird
bind = $mainMod, M, exec, swaync-client -t -sw

# Focus monitors
bind = $mainMod, Tab, focusmonitor, +1

bind = ALT, Tab, layoutmsg, focus r
bind = ALT SHIFT, Tab, layoutmsg, focus l

# Fullscreen shortcut with mainmod and return
bind = $mainMod, Return, fullscreen, 1
bind = $mainMod SHIFT, Return, fullscreen

# bind = CTRLSHIFT, 4, pass, class:^(com\.obsproject\.Studio)

# Convert HTML to markdown
bind = $mainMod SHIFT, C, exec, wl-paste --type text/html | html2md -i -T | wl-copy
# bind = $mainMod SHIFT, escape, releaseinputcapture

# Scrolling
bind = $mainMod, slash, layoutmsg, promote
bind = $mainMod, period, layoutmsg, swapcol r
bind = $mainMod, comma, layoutmsg, swapcol l

gesture = 3, horizontal, scrollMove
gestures {
	scrolling {
		move_snap_to_grid = 0
	}
}


bind = $mainMod, J, layoutmsg, consume l
bind = $mainMod, K, layoutmsg, consume r
